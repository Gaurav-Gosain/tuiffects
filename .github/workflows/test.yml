name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: Library and command (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The version go.mod declares, and the current release.
        go: ['1.22', 'stable']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: Check formatting
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Test with the race detector
        run: go test -count=1 -race -short ./...

  demo:
    name: Demo module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: demo/go.mod
          cache-dependency-path: demo/go.sum

      - name: Vet
        working-directory: demo
        run: go vet ./...

      - name: Test
        working-directory: demo
        run: go test -count=1 ./...
