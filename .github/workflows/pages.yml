name: Deploy the demo page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: demo/go.mod
          cache-dependency-path: demo/go.sum

      - name: Test the library and the demo
        run: go test ./... && cd demo && go test ./...

      - name: Write the catalogue
        working-directory: demo
        run: go run ./cmd/catalogue > ../web/catalogue.json

      - name: Compile the demo to WebAssembly
        working-directory: demo
        run: go tool booba-wasm-build -o ../web/app.wasm ./cmd/tuiffects-demo/

      - name: Populate the web assets
        working-directory: demo
        run: go tool booba-assets ../web/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
